format = 1
kind = "container"
name = "Job"
parent = "sys"

[petri_net.places.todo]
capacity = 1
when_full = "block"
initial = 1

[petri_net.places.done]
capacity = 1
when_full = "block"

[petri_net.transitions.work]
pre = { todo = 1 }
post = { done = 1 }

[petri_net.transitions.again]
pre = { done = 1 }
post = { todo = 1 }

[[property]]
id = "job-no-deadlock"
behavior = "own"
kind = "deadlock_free"
