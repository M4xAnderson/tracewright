[[composition]]
id = "C3"
fusions = [
  { relationship = "ra", caller = "a/take", callee = "l/acq" },
  { relationship = "ra", caller = "a/give", callee = "l/rel" },
  { relationship = "rb", caller = "b/take", callee = "l/acq" },
  { relationship = "rb", caller = "b/give", callee = "l/rel" },
]
deadlock_free = 3
encoding = """
petrinet-net 1
place a/has 1 block 0
place a/idle 1 block 1
place b/has 1 block 0
place b/idle 1 block 1
place l/x 1 block 1
transition ra/give+rel
pre a/has 1
post a/idle 1
post l/x 1
transition ra/take+acq
pre a/idle 1
pre l/x 1
post a/has 1
transition rb/give+rel
pre b/has 1
post b/idle 1
post l/x 1
transition rb/take+acq
pre b/idle 1
pre l/x 1
post b/has 1
"""
[[composition.parts]]
places = [{ id = "a/idle", capacity = 1, initial = 1 }, { id = "a/has", capacity = 1 }]
transitions = [{ id = "a/take", pre = { "a/idle" = 1 }, post = { "a/has" = 1 } }, { id = "a/give", pre = { "a/has" = 1 }, post = { "a/idle" = 1 } }]
[[composition.parts]]
places = [{ id = "b/idle", capacity = 1, initial = 1 }, { id = "b/has", capacity = 1 }]
transitions = [{ id = "b/take", pre = { "b/idle" = 1 }, post = { "b/has" = 1 } }, { id = "b/give", pre = { "b/has" = 1 }, post = { "b/idle" = 1 } }]
[[composition.parts]]
places = [{ id = "l/x", capacity = 1, initial = 1 }]
transitions = [{ id = "l/acq", pre = { "l/x" = 1 } }, { id = "l/rel", post = { "l/x" = 1 } }]

