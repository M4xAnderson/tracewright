# NS §14.4 (h): a second receiving transition adds one more `pre r 1`.
[[composition]]
id = "h"
links = [{ relationship = "r", from = ["p/produce"], to = ["c/consume", "c/consume2"], capacity = 3, when_full = "overflow" }]
encoding = """
petrinet-net 1
place c/got 5 block 0
place p/items 5 block 5
place r 3 overflow 0
transition c/consume
pre r 1
post c/got 1
transition c/consume2
pre r 1
post c/got 1
transition p/produce
pre p/items 1
post r 1
"""
[[composition.parts]]
places = [{ id = "p/items", capacity = 5, initial = 5 }]
transitions = [{ id = "p/produce", pre = { "p/items" = 1 } }]
[[composition.parts]]
places = [{ id = "c/got", capacity = 5 }]
transitions = [{ id = "c/consume", post = { "c/got" = 1 } }, { id = "c/consume2", post = { "c/got" = 1 } }]

