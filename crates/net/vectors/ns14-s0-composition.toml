pre consumer/ready 1
post consumer/paused 1
transition consumer/resume
pre consumer/paused 1
post consumer/ready 1
transition consumer/run
pre consumer/ready 1
pre jobs 1
post consumer/ready 1
transition consumer/skip
pre consumer/paused 1
pre jobs 1
post consumer/paused 1
transition producer/send
pre producer/p 1
post jobs 1
post producer/p 1
"""
[[composition.parts]]
places = [{ id = "producer/p", capacity = 1, initial = 1 }]
transitions = [{ id = "producer/send", pre = { "producer/p" = 1 }, post = { "producer/p" = 1 } }]
[[composition.parts]]
