# A call over a sync pair and its reply over an async pair on one relationship (D-07): the reply
# pair runs from the target b back to the source a.
[[composition]]
id = "call-async-reply"
fusions = [{ relationship = "r", caller = "a/call", callee = "b/serve" }]
links = [{ relationship = "r", from = ["b/answer"], to = ["a/reply"], capacity = 1, when_full = "block" }]
deadlock_free = 3
encoding = """
petrinet-net 1
place a/busy 1 block 0
place a/idle 1 block 1
place b/free 1 block 1
place b/work 1 block 0
place r 1 block 0
transition a/reply
pre a/busy 1
pre r 1
post a/idle 1
transition b/answer
pre b/work 1
post b/free 1
post r 1
transition r/call+serve
pre a/idle 1
pre b/free 1
post a/busy 1
post b/work 1
"""
[[composition.parts]]
places = [{ id = "a/idle", capacity = 1, initial = 1 }, { id = "a/busy", capacity = 1 }]
transitions = [{ id = "a/call", pre = { "a/idle" = 1 }, post = { "a/busy" = 1 } }, { id = "a/reply", pre = { "a/busy" = 1 }, post = { "a/idle" = 1 } }]
[[composition.parts]]
places = [{ id = "b/free", capacity = 1, initial = 1 }, { id = "b/work", capacity = 1 }]
transitions = [{ id = "b/serve", pre = { "b/free" = 1 }, post = { "b/work" = 1 } }, { id = "b/answer", pre = { "b/work" = 1 }, post = { "b/free" = 1 } }]

