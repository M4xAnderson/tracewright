# Composition vectors of docs/specs/net-semantics.md §14.3 that need only block places and
# synchronous fusion. Read by the tests of `recheck::compose` and of `engine::flatten`, each with
# its own harness: both must produce exactly `encoding`, or, for `rejected`, recheck returns a
# ComposeError (engine refuses those inputs earlier, in lowering, with the L-rule named here).
# Every place is `block`. `deadlock_free` is the |R| of a Proved deadlock-free where NS gives it.

[[composition]]
id = "C1"
fusions = [{ relationship = "r", caller = "a/call", callee = "b/serve" }]
deadlock_free = 2
encoding = """
petrinet-net 1
place a/busy 1 block 0
place a/idle 1 block 1
place b/free 1 block 1
transition a/done
pre a/busy 1
post a/idle 1
transition r/call+serve
pre a/idle 1
pre b/free 1
post a/busy 1
post b/free 1
"""
[[composition.parts]]
places = [{ id = "a/idle", capacity = 1, initial = 1 }, { id = "a/busy", capacity = 1 }]
transitions = [{ id = "a/call", pre = { "a/idle" = 1 }, post = { "a/busy" = 1 } }, { id = "a/done", pre = { "a/busy" = 1 }, post = { "a/idle" = 1 } }]
[[composition.parts]]
places = [{ id = "b/free", capacity = 1, initial = 1 }]
transitions = [{ id = "b/serve", pre = { "b/free" = 1 }, post = { "b/free" = 1 } }]

