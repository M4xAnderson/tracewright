# Composition vectors of docs/specs/net-semantics.md §14.3: synchronous fusion and asynchronous
# bindings. Read by the tests of `recheck::compose` and of `engine::flatten`, each with its own
# harness: both must produce exactly `encoding`, or, for `rejected`, recheck returns a
# ComposeError (engine refuses those inputs earlier, in lowering, with the L-rule named here).
# A place is `block` unless it states `when_full`; a link is an AsyncLink with its sets as lists.
# `deadlock_free` is the |R| of a Proved deadlock-free where NS gives it. C17–C20 are tagged S2 in
# NS §15 because only state machines produce sets of more than one transition, but they pin the
# set-valued AsyncLink that slice 0 already carries (ADR 0016).

[[composition]]
id = "C1"
fusions = [{ relationship = "r", caller = "a/call", callee = "b/serve" }]
deadlock_free = 2
encoding = """
petrinet-net 1
place a/busy 1 block 0
place a/idle 1 block 1
place b/free 1 block 1
transition a/done
pre a/busy 1
post a/idle 1
transition r/call+serve
pre a/idle 1
pre b/free 1
post a/busy 1
post b/free 1
"""
[[composition.parts]]
places = [{ id = "a/idle", capacity = 1, initial = 1 }, { id = "a/busy", capacity = 1 }]
transitions = [{ id = "a/call", pre = { "a/idle" = 1 }, post = { "a/busy" = 1 } }, { id = "a/done", pre = { "a/busy" = 1 }, post = { "a/idle" = 1 } }]
[[composition.parts]]
places = [{ id = "b/free", capacity = 1, initial = 1 }]
transitions = [{ id = "b/serve", pre = { "b/free" = 1 }, post = { "b/free" = 1 } }]

[[composition]]
id = "C2"
fusions = [
  { relationship = "r1", caller = "a/call", callee = "b/serve" },
  { relationship = "r2", caller = "a/call", callee = "c/serve" },
]
encoding = """
petrinet-net 1
place a/busy 1 block 0
place a/idle 1 block 1
place b/free 1 block 1
place c/free 1 block 1
transition a/done
pre a/busy 1
post a/idle 1
transition r1/call+serve
pre a/idle 1
pre b/free 1
post a/busy 1
post b/free 1
transition r2/call+serve
pre a/idle 1
pre c/free 1
post a/busy 1
post c/free 1
"""
[[composition.parts]]
places = [{ id = "a/idle", capacity = 1, initial = 1 }, { id = "a/busy", capacity = 1 }]
transitions = [{ id = "a/call", pre = { "a/idle" = 1 }, post = { "a/busy" = 1 } }, { id = "a/done", pre = { "a/busy" = 1 }, post = { "a/idle" = 1 } }]
[[composition.parts]]
places = [{ id = "b/free", capacity = 1, initial = 1 }]
transitions = [{ id = "b/serve", pre = { "b/free" = 1 }, post = { "b/free" = 1 } }]
[[composition.parts]]
places = [{ id = "c/free", capacity = 1, initial = 1 }]
transitions = [{ id = "c/serve", pre = { "c/free" = 1 }, post = { "c/free" = 1 } }]

[[composition]]
id = "C3"
fusions = [
  { relationship = "ra", caller = "a/take", callee = "l/acq" },
  { relationship = "ra", caller = "a/give", callee = "l/rel" },
  { relationship = "rb", caller = "b/take", callee = "l/acq" },
  { relationship = "rb", caller = "b/give", callee = "l/rel" },
]
deadlock_free = 3
encoding = """
petrinet-net 1
place a/has 1 block 0
place a/idle 1 block 1
place b/has 1 block 0
place b/idle 1 block 1
place l/x 1 block 1
transition ra/give+rel
pre a/has 1
post a/idle 1
post l/x 1
transition ra/take+acq
pre a/idle 1
pre l/x 1
post a/has 1
transition rb/give+rel
pre b/has 1
post b/idle 1
post l/x 1
transition rb/take+acq
pre b/idle 1
pre l/x 1
post b/has 1
"""
[[composition.parts]]
places = [{ id = "a/idle", capacity = 1, initial = 1 }, { id = "a/has", capacity = 1 }]
transitions = [{ id = "a/take", pre = { "a/idle" = 1 }, post = { "a/has" = 1 } }, { id = "a/give", pre = { "a/has" = 1 }, post = { "a/idle" = 1 } }]
[[composition.parts]]
places = [{ id = "b/idle", capacity = 1, initial = 1 }, { id = "b/has", capacity = 1 }]
transitions = [{ id = "b/take", pre = { "b/idle" = 1 }, post = { "b/has" = 1 } }, { id = "b/give", pre = { "b/has" = 1 }, post = { "b/idle" = 1 } }]
[[composition.parts]]
places = [{ id = "l/x", capacity = 1, initial = 1 }]
transitions = [{ id = "l/acq", pre = { "l/x" = 1 } }, { id = "l/rel", post = { "l/x" = 1 } }]

[[composition]]
