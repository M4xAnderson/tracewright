# Conformance vectors of docs/specs/net-semantics.md §14.1, slice 0, written as flattened nets
# (qualified IDs, NS §2.4). Read by the tests of `verify` and of `recheck`, each with its own
# harness, so neither explorer's tests lean on the other's code (ADR 0010). Nets follow the E1
# corpus (`prototype/e1-state-space`, fixtures/ns-vectors.toml); the drop, overflow and generated
# place nets (PC, BRANCH, FE1, ...) are the shared nets of NS §14.
#
# A place is `block` unless it states `when_full`. `property` is "deadlock-free" unless stated.
# `expect` is one of:
#   "proved"                   exhaustive, `markings` = |R|
#   "certificate"              Proved by NoOverflowPlace with exactly `drop_places`, no exploration
#   "disproved"                a counterexample firing `fired`; its violation is `waiting` (a
#                              deadlock) or `overflow` = { place, capacity, count }
#   "capacity-exceeded-first"  Unknown after a complete exploration, naming `place`, with the run
#                              `fired` to the first overflow marking
#   "rejected"                 a structurally invalid net: Unknown InternalError
# `stored` is the number of stored markings when the violation is discovered, or |R ∪ O| for a
# capacity exceeded first (NS §14); `markings` is |R| of a Proved. Both are pinned through the
# budget too: the vector holds with exactly that many markings and runs out with one fewer
# (NS §10.1 c, d; budget vectors B1, B2, B11, B12). A certificate holds with a budget of 0 (B13).
# A wait is { place, needs = [needed, holds] } or { place, full = [capacity, would_hold] }.

[nets.ONE]
places = [{ id = "x/p", capacity = 1, initial = 1 }]
transitions = []

[nets.SRC]
places = [{ id = "x/p", capacity = 2 }]
transitions = [{ id = "x/t", post = { "x/p" = 1 } }]

[nets.V08]
places = [{ id = "x/p", capacity = 1, initial = 1 }]
transitions = [{ id = "x/t", pre = { "x/p" = 1 }, post = { "x/p" = 1 } }]

[nets.V09]
