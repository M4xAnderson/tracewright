# PC(k): the producer and consumer of C4/C5, flattened; `r` is the generated place.
[nets.PC_block]
places = [{ id = "p/items", capacity = 5, initial = 5 }, { id = "c/got", capacity = 5 }, { id = "r", capacity = 3 }]
transitions = [{ id = "p/produce", pre = { "p/items" = 1 }, post = { "r" = 1 } }, { id = "c/consume", pre = { "r" = 1 }, post = { "c/got" = 1 } }]

[nets.PC_drop]
places = [{ id = "p/items", capacity = 5, initial = 5 }, { id = "c/got", capacity = 5 }, { id = "r", capacity = 3, when_full = "drop" }]
transitions = [{ id = "p/produce", pre = { "p/items" = 1 }, post = { "r" = 1 } }, { id = "c/consume", pre = { "r" = 1 }, post = { "c/got" = 1 } }]

[nets.PC_overflow]
places = [{ id = "p/items", capacity = 5, initial = 5 }, { id = "c/got", capacity = 5 }, { id = "r", capacity = 3, when_full = "overflow" }]
transitions = [{ id = "p/produce", pre = { "p/items" = 1 }, post = { "r" = 1 } }, { id = "c/consume", pre = { "r" = 1 }, post = { "c/got" = 1 } }]

[nets.BRANCH]
places = [{ id = "x/c", capacity = 1, initial = 1 }, { id = "x/d", capacity = 1 }, { id = "x/p", capacity = 1, when_full = "overflow" }]
transitions = [
