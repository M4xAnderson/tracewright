# Conformance vectors of docs/specs/net-semantics.md §14.1, slice 0, that need only block places
# and synchronous fusion, written as flattened nets (qualified IDs, NS §2.4). Read by the tests of
# `verify` and of `recheck`, each with its own harness, so neither explorer's tests lean on the
# other's code (ADR 0010). Nets follow the E1 corpus (`prototype/e1-state-space`,
# fixtures/ns-vectors.toml).
#
# Every place is `block`. `stored` is the number of stored markings when the violation is
# discovered (NS §14), `markings` is |R| of a Proved. Both are pinned through the budget too: the
# vector holds with exactly that many markings and runs out with one fewer (NS §10.1 c, d).
# A wait is { place, needs = [needed, holds] } or { place, full = [capacity, would_hold] }.

[nets.ONE]
places = [{ id = "x/p", capacity = 1, initial = 1 }]
transitions = []

[nets.SRC]
places = [{ id = "x/p", capacity = 2 }]
transitions = [{ id = "x/t", post = { "x/p" = 1 } }]

[nets.V08]
places = [{ id = "x/p", capacity = 1, initial = 1 }]
transitions = [{ id = "x/t", pre = { "x/p" = 1 }, post = { "x/p" = 1 } }]

[nets.V09]
places = [{ id = "x/p", capacity = 3, initial = 3 }, { id = "x/q", capacity = 1 }]
transitions = [{ id = "x/t", pre = { "x/p" = 2 }, post = { "x/q" = 1 } }]

[nets.V10]
places = [{ id = "x/p", capacity = 2 }]
transitions = [{ id = "x/t", post = { "x/p" = 3 } }]

[nets.V52]
places = [{ id = "x/p", capacity = 4294967294, initial = 4294967294 }]
transitions = [{ id = "x/t", post = { "x/p" = 1 } }]

