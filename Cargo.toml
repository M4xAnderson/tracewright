[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
tracewright-model = { path = "crates/model" }
tracewright-net = { path = "crates/net" }
tracewright-verify = { path = "crates/verify" }
tracewright-recheck = { path = "crates/recheck" }
tracewright-format = { path = "crates/format" }
tracewright-scan = { path = "crates/scan" }
tracewright-engine = { path = "crates/engine" }
thiserror = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
toml = "1"
blake3 = { version = "1.8", default-features = false }
proptest = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "serde"] }

[profile.release]
overflow-checks = true # LIM-4: crash instead of wrapping
panic = "unwind"       # SAFE-4, ADR 0006, D-72: a panicked check thread is joined and becomes Unknown
# debug-assertions stays off: core crates use assert!, which is always on (SAFE-1)

[workspace.lints.rust]
unsafe_code = "deny" # core crate roots add #![forbid(unsafe_code)] (SAFE-5)
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
collapsible_if = "allow" # TigerStyle control flow (LIM-3)
collapsible_else_if = "allow"
unwrap_used = "deny"            # SAFE-2
missing_assert_message = "deny" # SAFE-1
todo = "deny"                   # G-4
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny" # SAFE-3
map_err_ignore = "deny"
unused_result_ok = "deny"
allow_attributes = "deny" # G-2: #[expect(.., reason = "..")] only
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
