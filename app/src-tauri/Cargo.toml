[package]
name = "tracewright-app"
description = "The Tauri 2 shell: thin commands over the engine, the local log and the panic hook."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "tracewright-app"

[lib]
name = "tracewright_app"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tracewright-engine.workspace = true
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
ts-rs = "12"
dirs = "6"
humantime = "2"
thiserror.workspace = true
tauri-plugin-dialog = "2.8"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
